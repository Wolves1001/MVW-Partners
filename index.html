<!doctype html><html data-theme="light" style="color-scheme:only light"><head><meta name="color-scheme" content="only light"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MVW Partners</title><style>@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap");

/* MVW Partners components. Every value comes from tokens.css. */
.mvw-root, .mvw-root * { box-sizing: border-box; }
.mvw-root { font-family: var(--font-body); color: var(--ink-600); background: var(--surface-000); -webkit-font-smoothing: antialiased; }
.mvw-container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--space-8); }
.mvw-section { padding: var(--space-24) 0; }
.mvw-section--white { background: var(--surface-000); }

/* Logo */
.mvw-logo { display: inline-flex; align-items: center; text-decoration: none; }
.mvw-logo svg { display: block; width: auto; }

/* Button */
.mvw-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; padding: 14px var(--space-6); border-radius: var(--radius-md); border: 1px solid transparent; text-decoration: none; cursor: pointer; transition: background-color .15s ease, border-color .15s ease, color .15s ease; white-space: nowrap; }
.mvw-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.mvw-btn-arrow { transition: transform .15s ease; }
.mvw-btn:hover .mvw-btn-arrow { transform: translateX(3px); }
.mvw-btn--primary { background: var(--brand-navy); color: var(--on-inverse); }
.mvw-btn--primary:hover { background: var(--brand-ink-deep); }
.mvw-btn--secondary { background: var(--surface-000); color: var(--heading); border-color: var(--control-border); }
.mvw-btn--secondary:hover { border-color: var(--heading); }
.mvw-btn--inverse { background: var(--on-inverse); color: var(--brand-navy); }
.mvw-btn--inverse:hover { background: var(--line-200); }
.mvw-btn--ghost-inverse { background: transparent; color: var(--on-inverse); border-color: var(--on-inverse-subtle); }
.mvw-btn--ghost-inverse:hover { border-color: var(--on-inverse); }
.mvw-btn--link { padding: 0; border: 0; background: none; color: var(--heading); }
.mvw-btn--link:hover { color: var(--accent-text); }
.mvw-btn--sm { padding: 10px 20px; font-size: 14px; }

/* Eyebrow and tag */
.mvw-eyebrow { display: inline-block; font-family: var(--font-body); font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent-text); }
.mvw-eyebrow--inverse { color: var(--on-inverse-accent); }
.mvw-tag { display: inline-flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 600; padding: 4px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-100); color: var(--ink-700); }
.mvw-tag--inverse { background: transparent; color: var(--on-inverse-muted); border: 1px solid var(--line-inverse); }

/* Section header */
.mvw-sh { max-width: 720px; margin-bottom: var(--space-12); }
.mvw-sh--center { margin-left: auto; margin-right: auto; text-align: center; }
.mvw-sh h2 { font-family: var(--font-display); font-size: 36px; line-height: 44px; font-weight: 800; letter-spacing: -0.8px; color: var(--heading); margin: var(--space-3) 0 var(--space-4); }
.mvw-sh p { font-size: 18px; line-height: 29px; color: var(--ink-600); margin: 0; }
.mvw-sh--inverse h2 { color: var(--on-inverse); }
.mvw-sh--inverse p { color: var(--on-inverse-muted); }

/* Utility bar + header */
.mvw-utility { background: var(--brand-ink-deep); color: var(--on-inverse-subtle); font-size: 13px; line-height: 18px; }
.mvw-utility .mvw-container { display: flex; justify-content: space-between; align-items: center; height: 40px; }
.mvw-utility-right { display: flex; gap: var(--space-6); align-items: center; }
.mvw-utility a { color: var(--on-inverse); text-decoration: none; font-weight: 600; }
.mvw-utility a:hover { text-decoration: underline; }
.mvw-header { background: var(--surface-000); border-bottom: 1px solid var(--line-200); position: sticky; top: 0; z-index: 10; }
.mvw-header .mvw-container { display: flex; align-items: center; justify-content: space-between; height: 96px; gap: var(--space-8); }
.mvw-nav { display: flex; gap: var(--space-8); }
.mvw-nav a { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink-700); text-decoration: none; padding: var(--space-2) 0; border-bottom: 2px solid transparent; transition: color .15s ease, border-color .15s ease; }
.mvw-nav a:hover, .mvw-nav a[aria-current] { color: var(--heading); border-bottom-color: var(--brand-steel); }
.mvw-nav a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }

/* Hero */
.mvw-hero { position: relative; overflow: hidden; background: var(--brand-navy); }
/* Slow drifting blueprint grid on navy, faded out toward the edges. */
.mvw-hero::before { content: ""; position: absolute; inset: -48px; pointer-events: none;
  background-image: linear-gradient(to right, rgba(147, 197, 253, .11) 1px, transparent 1px), linear-gradient(rgba(147, 197, 253, .11) 1px, transparent 1px);
  background-size: 48px 48px; animation: mvw-grid-drift 30s linear infinite;
  -webkit-mask-image: radial-gradient(ellipse 80% 90% at 65% 40%, #000 25%, transparent 80%); mask-image: radial-gradient(ellipse 80% 90% at 65% 40%, #000 25%, transparent 80%); }

.mvw-hero .mvw-container { position: relative; display: grid; grid-template-columns: 1.25fr .75fr; gap: var(--space-16); align-items: center; padding-top: var(--space-24); padding-bottom: var(--space-16); }
.mvw-hero h1 { font-family: var(--font-display); font-size: 54px; line-height: 60px; font-weight: 800; letter-spacing: -1.3px; color: var(--on-inverse); margin: var(--space-4) 0 var(--space-6); max-width: 680px; }
.mvw-hero-lead { font-size: 19px; line-height: 30px; margin: 0 0 var(--space-8); max-width: 600px; color: var(--on-inverse-muted); }
.mvw-hero-actions { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.mvw-hero-card { background: var(--surface-000); border: 1px solid var(--line-200); border-top: 4px solid var(--brand-steel); border-radius: var(--radius-lg); padding: var(--space-8); box-shadow: var(--shadow-lg); }
.mvw-hero-card h2 { font-family: var(--font-display); font-size: 18px; line-height: 24px; font-weight: 700; color: var(--heading); margin: 0 0 var(--space-4); }
.mvw-hero-card ul { list-style: none; margin: 0; padding: 0; }
.mvw-hero-card li { display: flex; align-items: center; gap: var(--space-3); font-size: 15px; line-height: 22px; color: var(--ink-900); padding: var(--space-3) 0; border-bottom: 1px solid var(--line-100); }
.mvw-hero-card li svg { color: var(--brand-steel); flex: none; }
.mvw-hero-card-foot { margin-top: var(--space-4); font-size: 13px; line-height: 20px; color: var(--ink-500); }
.mvw-hero-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--brand-steel); }
.mvw-hero-stats > div { padding: var(--space-6) var(--space-6) 0 0; }
.mvw-hero-stats > div + div { padding-left: var(--space-8); border-left: 1px solid var(--brand-steel); }
.mvw-stat-value { font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 800; color: var(--on-inverse); letter-spacing: -0.6px; }
.mvw-stat-label { font-size: 14px; line-height: 20px; color: var(--on-inverse-subtle); margin-top: var(--space-1); }

/* Credentials strip */
.mvw-creds { background: var(--brand-ink-deep); }
.mvw-creds .mvw-container { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
.mvw-cred { display: flex; align-items: center; gap: var(--space-2); font-size: 14px; line-height: 20px; font-weight: 600; color: var(--on-inverse); }
.mvw-cred svg { color: var(--on-inverse-accent); flex: none; }

/* Audience panel */
.mvw-panels { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
.mvw-panel { border-radius: var(--radius-lg); padding: var(--space-12); border: 1px solid var(--line-200); background: var(--surface-000); display: flex; flex-direction: column; }
.mvw-panel--tint { background: var(--surface-100); border-color: var(--surface-100); }
.mvw-panel h3 { font-family: var(--font-display); font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.4px; color: var(--heading); margin: var(--space-3) 0 var(--space-4); }
.mvw-panel > p { font-size: 16px; line-height: 26px; margin: 0 0 var(--space-8); color: var(--ink-600); }
.mvw-points { list-style: none; padding: 0; margin: 0 0 var(--space-8); display: grid; gap: var(--space-4); }
.mvw-points li { display: grid; grid-template-columns: 18px 1fr; gap: var(--space-3); font-size: 15px; line-height: 23px; color: var(--ink-600); }
.mvw-points li strong { color: var(--ink-900); font-weight: 600; }
.mvw-points li svg { color: var(--brand-steel); margin-top: 3px; }
.mvw-panel-cta { margin-top: auto; }

/* Capability card */
.mvw-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-6); }
.mvw-card { background: var(--surface-000); border: 1px solid var(--line-200); border-top: 3px solid var(--brand-steel); border-radius: var(--radius-lg); padding: var(--space-8) var(--space-6) var(--space-6); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); transition: box-shadow .2s ease, border-color .2s ease; text-decoration: none; color: inherit; }
.mvw-card:hover { box-shadow: var(--shadow-md); border-top-color: var(--brand-navy); }
.mvw-card h3 { font-family: var(--font-display); font-size: 19px; line-height: 25px; font-weight: 700; color: var(--heading); margin: 0 0 var(--space-3); }
.mvw-card p { font-size: 15px; line-height: 23px; color: var(--ink-600); margin: 0 0 var(--space-6); }
.mvw-card-foot { margin-top: auto; padding-top: var(--space-4); border-top: 1px solid var(--line-100); display: flex; justify-content: space-between; gap: var(--space-2); font-size: 13px; line-height: 18px; }
.mvw-card-foot span:first-child { font-weight: 600; color: var(--heading); }

.mvw-step-num { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-pill); background: var(--brand-navy); color: var(--on-inverse); font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-bottom: var(--space-4); }
.mvw-step h3 { font-family: var(--font-display); font-size: 19px; line-height: 25px; font-weight: 700; color: var(--heading); margin: 0 0 var(--space-3); }
.mvw-step p { font-size: 15px; line-height: 23px; color: var(--ink-600); margin: 0; }

.mvw-desk { display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--space-6); }

.mvw-desk-main h3 { font-family: var(--font-display); font-size: 26px; line-height: 32px; font-weight: 700; color: var(--on-inverse); margin: 0 0 var(--space-3); }

.mvw-footer a { color: var(--ink-600); text-decoration: none; }

.mvw-legal a { color: var(--ink-500); }

/* Scroll reveal: only hides content once the script has switched it on. */
.mvw-reveal-on .mvw-reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
.mvw-reveal-on .mvw-reveal.is-in { opacity: 1; transform: none; }

  .mvw-hero::before { animation: none; }
  .mvw-reveal-on .mvw-reveal { opacity: 1; transform: none; transition: none; }

@media (max-width: 960px) {
  .mvw-hero .mvw-container, .mvw-panels, .mvw-desk { grid-template-columns: 1fr; }
  .mvw-cards, .mvw-steps { grid-template-columns: 1fr 1fr; }
  .mvw-footer-top { grid-template-columns: 1fr 1fr; }
  .mvw-nav { display: none; }

@media (max-width: 600px) {
  .mvw-container { padding: 0 var(--space-4); }
  .mvw-header .mvw-container { height: 76px; gap: var(--space-3); }
  .mvw-header .mvw-logo svg { height: 46px; }
  .mvw-header .mvw-btn--sm { padding: 8px 12px; font-size: 13px; }
  .mvw-hero h1 { font-size: 38px; line-height: 44px; }
  .mvw-hero-stats { grid-template-columns: 1fr; }
  .mvw-hero-stats > div + div { padding-left: 0; border-left: 0; }
  .mvw-cards, .mvw-steps, .mvw-footer-top { grid-template-columns: 1fr; }
  .mvw-panel, .mvw-desk-main { padding: var(--space-8) var(--space-6); }
  .mvw-utility-right span, .mvw-utility .mvw-container > span { display: none; }
}
